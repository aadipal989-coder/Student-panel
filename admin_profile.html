<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; }
        .profile-container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .profile-header { background: #1a202c; color: white; text-align: center; padding: 30px 20px; }
        
        .profile-img-container { position: relative; width: 110px; height: 110px; margin: 0 auto 10px; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; background: #2d3748; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid #fff; object-fit: cover; }
        
        .upload-badge { position: absolute; bottom: 0; right: 0; background: #e53e3e; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; border: 2px solid white; }
        #imageInput { display: none; }
        
        .profile-body { padding: 20px; }
        .info-group { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #edf2f7; }
        .info-label { font-weight: bold; color: #4a5568; }
        .info-value { color: #2d3748; }
        .badge { background: #e53e3e; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .back-btn { display: block; width: 100%; text-align: center; background: #2d3748; color: white; padding: 10px; border-radius: 5px; text-decoration: none; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="profile-container">
    <div class="profile-header">
        <div class="profile-img-container">
            <img id="profileImage" class="profile-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><text y='65' font-size='60'>👨‍💼</text></svg>" alt="Admin Photo">
            <label for="imageInput" class="upload-badge">📷</label>
            <input type="file" id="imageInput" accept="image/*" onchange="previewAdminImage(event)">
        </div>
        <h2>System Administrator</h2>
        <p>Admin ID: ADM-001</p>
    </div>

    <div class="profile-body">
        <div class="info-group">
            <span class="info-label">Role:</span>
            <span class="info-value"><span class="badge">SUPER ADMIN</span></span>
        </div>
        <div class="info-group">
            <span class="info-label">Access Level:</span>
            <span class="info-value">Full System Control</span>
        </div>
        <div class="info-group">
            <span class="info-label">Email:</span>
            <span class="info-value">admin@college.edu</span>
        </div>
        <div class="info-group">
            <span class="info-label">Phone:</span>
            <span class="info-value">+91 9900112233</span>
        </div>
        <div class="info-group">
            <span class="info-label">Database Status:</span>
            <span class="info-value" style="color: #38a169; font-weight: bold;">SQLite Connected</span>
        </div>

        <a href="admin_dashboard.html" class="back-btn">Back to Dashboard</a>
    </div>
</div>

<script>
    const adminId = 'ADM-001';

    function previewAdminImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                document.getElementById('profileImage').src = imageUrl;
                localStorage.setItem('adminAvatar_' + adminId, imageUrl);
            };
            reader.readAsDataURL(file);
        }
    }

    window.onload = () => {
        const savedImage = localStorage.getItem('adminAvatar_' + adminId);
        if (savedImage) {
            document.getElementById('profileImage').src = savedImage;
        }
    };
</script>

</body>
</html>
