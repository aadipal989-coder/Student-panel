<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Wise Attendance</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }

        /* Header Navigation */
        .top-navbar {
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff; padding: 14px 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .back-btn {
            background: none; border: none; color: white; font-size: 16px;
            font-weight: bold; cursor: pointer; padding: 5px;
        }
        .nav-title { font-size: 15px; font-weight: bold; letter-spacing: 0.5px; }

        .container { padding: 15px; }

        /* Card Component */
        .card { background: #ffffff; border-radius: 10px; overflow: hidden; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; }
        .card-header { background: #2c3e50; color: #ffffff; padding: 10px 15px; font-size: 13px; font-weight: bold; }
        .card-body { padding: 15px; }

        /* Subject Dropdown Select */
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 5px; }
        .form-control {
            width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc;
            border-radius: 6px; background: #fff; color: #333; outline: none;
        }

        /* Subject Details Header Card */
        .sub-info-title { font-size: 16px; font-weight: bold; color: #1e3c72; margin-bottom: 4px; }
        .sub-info-code { font-size: 12px; font-weight: bold; color: #666; margin-bottom: 8px; }
        .sub-info-teacher { font-size: 13px; color: #333; }
        
        /* Badges */
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-safe { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .badge-warning { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

        /* Summary Grid */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; text-align: center; background: #e0e0e0; gap: 1px; }
        .summary-box { background: #ffffff; padding: 10px 4px; }
        .summary-head { font-size: 10px; font-weight: bold; color: #555; margin-bottom: 4px; }
        .summary-val { font-size: 15px; font-weight: bold; }
        .text-green { color: #2e7d32; }
        .text-red { color: #d32f2f; }

        /* Detailed History List */
        .history-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #eee; font-size: 13px;
        }
        .history-date { font-weight: bold; color: #333; }
        .history-time { font-size: 11px; color: #777; margin-top: 2px; }
        .status-badge-sm { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
        .bg-present { background: #e8f5e9; color: #2e7d32; }
        .bg-absent { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <div class="top-navbar">
        <button class="back-btn" onclick="window.location.href='index.html'">⬅️ Back</button>
        <span class="nav-title">SUBJECT WISE DETAILS</span>
        <span style="width: 30px;"></span>
    </div>

    <div class="container">

        <!-- Subject Selection -->
        <div class="card">
            <div class="card-header">Select Subject</div>
            <div class="card-body">
                <div class="form-group">
                    <label>Subject</label>
                    <select id="subjectSelect" class="form-control" onchange="renderSubjectData()">
                        <option value="MATH">Mathematics-III (BCA5004)</option>
                        <option value="SE">Software Engineering (BCA5002)</option>
                        <option value="WT">Web Technology Lab (BCA5005P)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Subject Header Card -->
        <div class="card">
            <div class="card-body" style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <div class="sub-info-title" id="subName">Mathematics-III</div>
                    <div class="sub-info-code" id="subCode">Code: BCA5004</div>
                    <div class="sub-info-teacher"><b>Faculty:</b> <span id="subTeacher">Mr. AMIT KUMAR TIWARI</span></div>
                </div>
                <div id="subStatusBadge">
                    <span class="badge badge-safe">✓ Safe Zone</span>
                </div>
            </div>
        </div>

        <!-- Attendance Status Summary Card -->
        <div class="card">
            <div class="card-header">Attendance Status</div>
            <div class="summary-grid">
                <div class="summary-box">
                    <div class="summary-head">TOTAL</div>
                    <div class="summary-val" id="totalLec">22</div>
                </div>
                <div class="summary-box">
                    <div class="summary-head">PRESENT</div>
                    <div class="summary-val text-green" id="presentLec">20</div>
                </div>
                <div class="summary-box">
                    <div class="summary-head">ABSENT</div>
                    <div class="summary-val text-red" id="absentLec">2</div>
                </div>
                <div class="summary-box">
                    <div class="summary-head">PERCENT</div>
                    <div class="summary-val text-green" id="percentLec">91%</div>
                </div>
            </div>
        </div>

        <!-- Detailed Date-Wise History -->
        <div class="card">
            <div class="card-header">Detailed Date-Wise History</div>
            <div class="card-body" id="historyList">
                <!-- Dynamic History items will be inserted here -->
            </div>
        </div>

    </div>

    <script>
        // Sample Subject Data
        const subjectDetails = {
            MATH: {
                name: "Mathematics-III",
                code: "BCA5004",
                teacher: "Mr. AMIT KUMAR TIWARI",
                total: 22,
                present: 20,
                absent: 2,
                percent: 91,
                isSafe: true,
                history: [
                    { date: "02-Sep-2026", time: "09:10 AM - 10:05 AM", status: "PRESENT" },
                    { date: "01-Sep-2026", time: "09:10 AM - 10:05 AM", status: "PRESENT" },
                    { date: "31-Aug-2026", time: "09:10 AM - 10:05 AM", status: "ABSENT" },
                    { date: "28-Aug-2026", time: "09:10 AM - 10:05 AM", status: "PRESENT" },
                    { date: "27-Aug-2026", time: "09:10 AM - 10:05 AM", status: "PRESENT" }
                ]
            },
            SE: {
                name: "Software Engineering",
                code: "BCA5002",
                teacher: "Dr. SURESH CHANDRA",
                total: 18,
                present: 12,
                absent: 6,
                percent: 66,
                isSafe: false,
                history: [
                    { date: "02-Sep-2026", time: "10:05 AM - 11:00 AM", status: "ABSENT" },
                    { date: "01-Sep-2026", time: "10:05 AM - 11:00 AM", status: "ABSENT" },
                    { date: "31-Aug-2026", time: "10:05 AM - 11:00 AM", status: "PRESENT" },
                    { date: "28-Aug-2026", time: "10:05 AM - 11:00 AM", status: "PRESENT" },
                    { date: "27-Aug-2026", time: "10:05 AM - 11:00 AM", status: "ABSENT" }
                ]
            },
            WT: {
                name: "Web Technology Lab",
                code: "BCA5005P",
                teacher: "Er. PRIYA SHARMA",
                total: 15,
                present: 14,
                absent: 1,
                percent: 93,
                isSafe: true,
                history: [
                    { date: "02-Sep-2026", time: "11:50 AM - 12:45 PM", status: "PRESENT" },
                    { date: "01-Sep-2026", time: "11:50 AM - 12:45 PM", status: "PRESENT" },
                    { date: "31-Aug-2026", time: "11:50 AM - 12:45 PM", status: "PRESENT" },
                    { date: "28-Aug-2026", time: "11:50 AM - 12:45 PM", status: "PRESENT" }
                ]
            }
        };

        function renderSubjectData() {
            const selectedVal = document.getElementById("subjectSelect").value;
            const data = subjectDetails[selectedVal];

            // Update Header Card
            document.getElementById("subName").innerText = data.name;
            document.getElementById("subCode").innerText = "Code: " + data.code;
            document.getElementById("subTeacher").innerText = data.teacher;

            // Status Badge
            const badgeContainer = document.getElementById("subStatusBadge");
            if(data.isSafe) {
                badgeContainer.innerHTML = `<span class="badge badge-safe">✓ Safe Zone</span>`;
            } else {
                badgeContainer.innerHTML = `<span class="badge badge-warning">⚠️ Low Attendance</span>`;
            }

            // Attendance Summary
            document.getElementById("totalLec").innerText = data.total;
            document.getElementById("presentLec").innerText = data.present;
            document.getElementById("absentLec").innerText = data.absent;
            
            const percentElem = document.getElementById("percentLec");
            percentElem.innerText = data.percent + "%";
            percentElem.className = data.isSafe ? "summary-val text-green" : "summary-val text-red";

            // Detailed History
            const historyContainer = document.getElementById("historyList");
            historyContainer.innerHTML = "";

            data.history.forEach(item => {
                const badgeClass = item.status === "PRESENT" ? "bg-present" : "bg-absent";
                const badgeText = item.status === "PRESENT" ? "✓ Present" : "✖ Absent";

                const html = `
                    <div class="history-item">
                        <div>
                            <div class="history-date">${item.date}</div>
                            <div class="history-time">🕒 ${item.time}</div>
                        </div>
                        <span class="status-badge-sm ${badgeClass}">${badgeText}</span>
                    </div>
                `;
                historyContainer.innerHTML += html;
            });
        }

        // Initialize on load
        document.addEventListener("DOMContentLoaded", () => {
            renderSubjectData();
        });
    </script>
</body>
</html>
