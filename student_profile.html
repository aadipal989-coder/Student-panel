<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; }
        .profile-container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .profile-header { background: #1a365d; color: white; text-align: center; padding: 30px 20px; }
        .profile-img-container { position: relative; width: 110px; height: 110px; margin: 0 auto 10px; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid #fff; object-fit: cover; }
        .upload-badge { position: absolute; bottom: 0; right: 0; background: #3182ce; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; border: 2px solid white; }
        #imageInput { display: none; }
        .profile-body { padding: 20px; }
        .info-group { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #edf2f7; }
        .info-label { font-weight: bold; color: #4a5568; }
        .info-value { color: #2d3748; }
        .back-btn { display: block; width: 100%; text-align: center; background: #2b6cb0; color: white; padding: 10px; border-radius: 5px; text-decoration: none; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="profile-container">
    <div class="profile-header">
        <div class="profile-img-container">
            <img id="profileImage" class="profile-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><text y='65' font-size='60'>👨‍🎓</text></svg>" alt="Profile Picture">
            <label for="imageInput" class="upload-badge">📷</label>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        </div>
        <h2 id="profName">Rahul Sharma</h2>
        <p id="profRoll">Roll No: 24116002670</p>
    </div>

    <div class="profile-body">
        <div class="info-group">
            <span class="info-label">User ID:</span>
            <span class="info-value" id="profUserId">245211</span>
        </div>
        <div class="info-group">
            <span class="info-label">Department:</span>
            <span class="info-value" id="profDept">Computer Science</span>
        </div>
        <div class="info-group">
            <span class="info-label">Semester:</span>
            <span class="info-value" id="profSem">6th Semester</span>
        </div>
        <div class="info-group">
            <span class="info-label">Email:</span>
            <span class="info-value" id="profEmail">rahul.24116002670@college.edu</span>
        </div>
        <div class="info-group">
            <span class="info-label">Phone:</span>
            <span class="info-value">+91 9876543210</span>
        </div>
        <div class="info-group">
            <span class="info-label">Fee Status:</span>
            <span class="info-value" id="profFeeStatus" style="font-weight: bold; color: #e53e3e;">Loading...</span>
        </div>

        <a href="index.html" class="back-btn">Back to Dashboard</a>
    </div>
</div>

<script>
    const rollNo = '24116002670';

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                document.getElementById('profileImage').src = imageUrl;
                localStorage.setItem('userAvatar_' + rollNo, imageUrl);
            };
            reader.readAsDataURL(file);
        }
    }

    async function initProfile() {
        const savedImage = localStorage.getItem('userAvatar_' + rollNo);
        if (savedImage) {
            document.getElementById('profileImage').src = savedImage;
        }

        try {
            const res = await fetch('http://localhost:3000/api/fee-status');
            const data = await res.json();
            if (data.success) {
                const student = data.data.find(s => s.rollNo === rollNo);
                if (student) {
                    document.getElementById('profFeeStatus').innerText = `${student.status} (Due: ₹${student.amountPaid})`;
                    document.getElementById('profFeeStatus').style.color = student.status === 'Paid' ? '#38a169' : '#e53e3e';
                }
            }
        } catch (err) {
            console.error("Profile API Error:", err);
        }
    }

    window.onload = initProfile;
</script>

</body>
</html>
