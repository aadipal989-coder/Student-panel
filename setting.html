<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Change Password</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }

        /* Header Navigation */
        .top-navbar {
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff; padding: 14px 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .back-btn {
            background: none; border: none; color: white; font-size: 16px;
            font-weight: bold; cursor: pointer; padding: 5px;
        }
        .nav-title { font-size: 15px; font-weight: bold; letter-spacing: 0.5px; }

        .container { padding: 15px; }

        /* Card Layout */
        .card { background: #ffffff; border-radius: 10px; overflow: hidden; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; }
        .card-header { background: #2c3e50; color: #ffffff; padding: 10px 15px; font-size: 13px; font-weight: bold; }
        .card-body { padding: 15px; }

        /* Form Controls */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 5px; }
        
        .input-wrapper { position: relative; }
        .form-control {
            width: 100%; padding: 10px 35px 10px 10px; font-size: 14px; border: 1px solid #ccc;
            border-radius: 6px; background: #fff; color: #333; outline: none;
        }
        .form-control:focus { border-color: #1976d2; }

        .toggle-eye {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            cursor: pointer; font-size: 16px; color: #777; user-select: none;
        }

        /* Password Guidelines */
        .hint-text { font-size: 11px; color: #666; margin-top: 4px; }

        /* Buttons */
        .btn-submit {
            width: 100%; padding: 12px; background: #1976d2; color: white;
            border: none; border-radius: 6px; font-size: 14px; font-weight: bold;
            cursor: pointer; margin-top: 10px;
        }
        .btn-submit:hover { background: #1565c0; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <button class="back-btn" onclick="window.location.href='index.html'">⬅️ Back</button>
        <span class="nav-title">SETTINGS</span>
        <span style="width: 30px;"></span>
    </div>

    <div class="container">

        <div class="card">
            <div class="card-body" style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 45px; height: 45px; background: #1e3c72; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold;">
                    👤
                </div>
                <div>
                    <div style="font-weight: bold; font-size: 15px; color: #333;">Rahul Sharma</div>
                    <div style="font-size: 12px; color: #666;">Roll No: 21CS45 | BCA 5th Sem</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">🔒 Change Password</div>
            <div class="card-body">
                <form id="passwordForm" onsubmit="handlePasswordChange(event)">
                    
                    <div class="form-group">
                        <label>Old Password <span style="color:red;">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="oldPass" class="form-control" placeholder="Enter current password" required>
                            <span class="toggle-eye" onclick="togglePassVisibility('oldPass', this)">👁️</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>New Password <span style="color:red;">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="newPass" class="form-control" placeholder="Enter new password" required>
                            <span class="toggle-eye" onclick="togglePassVisibility('newPass', this)">👁️</span>
                        </div>
                        <div class="hint-text">Minimum 6 characters with letters and numbers</div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password <span style="color:red;">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPass" class="form-control" placeholder="Re-enter new password" required>
                            <span class="toggle-eye" onclick="togglePassVisibility('confirmPass', this)">👁️</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">🔒 Update Password</button>

                </form>
            </div>
        </div>

    </div>

    <script>
        // Toggle Show/Hide Password
        function togglePassVisibility(inputId, eyeIcon) {
            const inputField = document.getElementById(inputId);
            if (inputField.type === "password") {
                inputField.type = "text";
                eyeIcon.innerText = "🙈";
            } else {
                inputField.type = "password";
                eyeIcon.innerText = "👁️";
            }
        }

        // Form Submit Validation
        function handlePasswordChange(e) {
            e.preventDefault();

            const oldPass = document.getElementById("oldPass").value;
            const newPass = document.getElementById("newPass").value;
            const confirmPass = document.getElementById("confirmPass").value;

            if (newPass.length < 6) {
                alert("Naya password kam se kam 6 characters ka hona chahiye!");
                return;
            }

            if (newPass !== confirmPass) {
                alert("New Password aur Confirm Password match nahi ho rahe hain!");
                return;
            }

            alert("🎉 Password successfully update ho gaya hai!");
            document.getElementById("passwordForm").reset();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
