<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Portal - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #3b2a6d;
        }

        /* Full Screen Container */
        .login-card {
            width: 100%;
            min-height: 100vh;
            background: #3b2a6d;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Image Banner */
        .banner-box {
            position: relative;
            height: 38vh;
            min-height: 220px;
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)), 
                        url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=800&auto=format&fit=crop') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .institute-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border-bottom: 2px solid #ffffff;
            padding-bottom: 5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 12px;
            opacity: 0.9;
            letter-spacing: 0.8px;
        }

        /* Purple Form Section */
        .form-section {
            background-color: #3b2a6d;
            padding: 30px 25px 40px 25px;
            color: #ffffff;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .login-heading {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .login-heading::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #a78bfa;
            border-radius: 2px;
        }

        /* Error Alert Message Box */
        .error-msg {
            background-color: #f87171;
            color: #7f1d1d;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
            display: none; /* Initially hidden */
            border-left: 4px solid #b91c1c;
        }

        /* Input Fields */
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #a78bfa;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 10px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid #6d28d9;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-bottom-color: #a78bfa;
        }

        .form-control::placeholder {
            color: #8b5cf6;
        }

        /* Forgot Password Option */
        .forgot-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .forgot-link {
            color: #c4b5fd;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #8b5cf6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: #7c3aed;
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <div class="banner-box">
            <div class="institute-title">Kanpur Institute of Technology</div>
            <div class="sub-title">Student Portal Login</div>
        </div>

        <div class="form-section">
            <div class="login-heading">Login</div>

            <div id="errorAlert" class="error-msg">
                ⚠️ Incorrect User ID or Password!
            </div>

            <form onsubmit="handleLogin(event)">
                
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="userId" class="form-control" placeholder="Enter User ID" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="userPass" class="form-control" placeholder="Enter Password" required>
                    <div class="forgot-wrapper">
                        <a href="javascript:void(0)" onclick="alert('Password reset link aapke registered email/mobile number par bhej diya gaya hai!')" class="forgot-link">Forgot Password?</a>
                    </div>
                </div>

                <button type="submit" class="btn-login">LOGIN</button>

            </form>
        </div>

    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();

            const userIdInput = document.getElementById("userId").value.trim();
            const userPassInput = document.getElementById("userPass").value.trim();
            const errorAlert = document.getElementById("errorAlert");

            // Define Correct Credentials
            const correctUserId = "245211";
            const correctPassword = "00000";

            // Credentials Validation Check
            if (userIdInput === correctUserId && userPassInput === correctPassword) {
                errorAlert.style.display = "none";
                window.location.href = "index.html"; // Redirect to Dashboard
            } else {
                errorAlert.style.display = "block"; // Show Error Message
            }
        }
    </script>
</body>
</html>
